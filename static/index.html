<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TOPSPIN · Liga de ping pong</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='13' cy='13' r='10' fill='%23ff2d46'/><rect x='18' y='18' width='5' height='12' rx='2' transform='rotate(-45 20 24)' fill='%23111a2e'/><circle cx='26' cy='7' r='3' fill='%23f5c542'/></svg>">
  <link rel="stylesheet" href="/styles.css">

<body>
  <header class="topbar">
    <a class="brand" href="#" data-action="inicio" aria-label="Inicio">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32"><circle cx="13" cy="13" r="10" fill="currentColor"/><rect x="18" y="18" width="5" height="12" rx="2" transform="rotate(-45 20 24)" fill="var(--ink)"/><circle cx="26.5" cy="6.5" r="3" fill="var(--gold)"/></svg>
      </span>
      <span class="brand-text"><b>TOPSPIN</b><small>Liga de ping pong</small></span>
    </a>
    <div class="switcher" id="switcher"></div>
    <nav class="top-actions" id="top-actions"></nav>
  </header>
  <div class="ticker" id="ticker" hidden></div>
  <main id="app" tabindex="-1"></main>
  <div id="modal-root"></div>
  <div id="toasts" aria-live="polite"></div>
  <script src="/app.js"></script>

</html>
